name: Release

on:
  push:
    tags:
      - "v*"
  # Run from main to tag v<plugin version> at main's head and publish it, for
  # contributors who can merge but cannot push tags.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check that the tag matches the plugin version
        id: tag
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "Run the release from main, not $GITHUB_REF_NAME" >&2
              exit 1
            fi
            tag="v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists: bump the version in the manifests first" >&2
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
            if [ "${tag#v}" != "$version" ]; then
              echo "Tag $tag does not match .claude-plugin/plugin.json version $version" >&2
              exit 1
            fi
          fi
          echo "name=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate
        run: |
          python3 -m compileall -q scripts skills tests
          python3 scripts/sync_skill_copies.py --check
          python3 -m unittest discover -s tests

      - name: Package skills
        run: python3 scripts/package_skills.py --output dist

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: "${{ steps.tag.outputs.name }} — iPhone Duo Agent Skills"
          generate_release_notes: true
          body: |
            One `.skill` archive per skill, built by `scripts/package_skills.py` (evals left out).

            - Install all five: `npx skills add https://github.com/alexey1312/iPhone-Duo-Agent-Skill`
            - Claude Code plugin: `/plugin marketplace add alexey1312/iPhone-Duo-Agent-Skill`, then `/plugin install iphone-duo-skills@iphone-duo-skills`
            - Manual: download an archive below and install it per your tool's skills docs (see the README)
          files: dist/*.skill
          fail_on_unmatched_files: true
