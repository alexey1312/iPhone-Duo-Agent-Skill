<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">iPhone Duo Agent Skills</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- iPhone Duo open in landscape (about 1.40:1): one display, the fold in the centre, vertical bar on the trailing edge -->
  <rect x="20" y="33" width="88" height="63" rx="12" fill="none" stroke="#fff" stroke-width="6"/>
  <path d="M64 26v78" stroke="#7ee7c7" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8"/>
  <!-- Vertical bar on the trailing half -->
  <path d="M96 48v6M96 61v6M96 74v6" stroke="#7ee7c7" stroke-width="6" stroke-linecap="round"/>
  <!-- Checkmark on the leading half -->
  <path d="m32 64 7 7 13-16" fill="none" stroke="#7ee7c7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
