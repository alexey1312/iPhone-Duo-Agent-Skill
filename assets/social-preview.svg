<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">iPhone Duo Agent Skills</title>
  <desc id="desc">Audit, plan and adapt SwiftUI and UIKit apps for iPhone Duo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#172554"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g transform="translate(0 80)">

  <!-- Device: iPhone Duo open in landscape (about 1.40:1) — one display, the folding region as a band in the centre, vertical bar on the trailing edge -->
  <g transform="translate(800 97)">
    <rect x="0" y="0" width="400" height="286" rx="34" fill="url(#panel)" stroke="#e2e8f0" stroke-width="6"/>
    <!-- folding region: a band content avoids, not a gap -->
    <rect x="188" y="3" width="24" height="280" fill="#7ee7c7" fill-opacity="0.08"/>
    <path d="M200 -16v318" stroke="#7ee7c7" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 14"/>
    <!-- leading half: list -->
    <rect x="30" y="44" width="118" height="18" rx="9" fill="#e2e8f0" fill-opacity="0.8"/>
    <rect x="30" y="80" width="100" height="12" rx="6" fill="#e2e8f0" fill-opacity="0.45"/>
    <rect x="30" y="104" width="110" height="12" rx="6" fill="#e2e8f0" fill-opacity="0.45"/>
    <rect x="30" y="128" width="84" height="12" rx="6" fill="#e2e8f0" fill-opacity="0.45"/>
    <!-- trailing half: detail -->
    <rect x="232" y="44" width="110" height="110" rx="16" fill="#e2e8f0" fill-opacity="0.25"/>
    <rect x="232" y="174" width="110" height="12" rx="6" fill="#e2e8f0" fill-opacity="0.45"/>
    <!-- vertical bar: Dynamic Island, status bar, toolbar, tab bar stacked on the trailing edge -->
    <rect x="364" y="40" width="18" height="150" rx="9" fill="#7ee7c7" fill-opacity="0.2"/>
    <circle cx="373" cy="64" r="5" fill="#7ee7c7"/>
    <circle cx="373" cy="98" r="5" fill="#7ee7c7"/>
    <circle cx="373" cy="132" r="5" fill="#7ee7c7"/>
    <circle cx="373" cy="166" r="5" fill="#7ee7c7"/>
    <!-- check -->
    <path d="m50 214 22 22 44-52" fill="none" stroke="#7ee7c7" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="150" fill="#7ee7c7" font-size="26" font-weight="600" letter-spacing="4">AGENT SKILLS</text>
    <text x="80" y="222" fill="#ffffff" font-size="72" font-weight="700">iPhone Duo</text>
    <text x="80" y="282" fill="#cbd5e1" font-size="30">Audit, plan and adapt SwiftUI &amp; UIKit apps</text>
    <text x="80" y="322" fill="#cbd5e1" font-size="30">for Apple's foldable — grounded in Apple's sessions.</text>
    <g font-size="22" font-weight="600" fill="#e2e8f0">
      <rect x="80" y="362" width="136" height="44" rx="22" fill="#ffffff" fill-opacity="0.1"/>
      <text x="148" y="391" text-anchor="middle">5 skills</text>
      <rect x="230" y="362" width="170" height="44" rx="22" fill="#ffffff" fill-opacity="0.1"/>
      <text x="315" y="391" text-anchor="middle">SDK-checked</text>
      <rect x="414" y="362" width="196" height="44" rx="22" fill="#ffffff" fill-opacity="0.1"/>
      <text x="512" y="391" text-anchor="middle">Approval-gated</text>
    </g>
  </g>
  </g>
</svg>
